<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      .chatbot-container-top {
        grid-template-rows: auto 1fr;
        height: calc(100vh - 80px);
      }

      .chatbot-container {
        font-family: Arial;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;
        display: grid;
      }

      .chat-input-container{
        display: grid;
        grid-template-columns: 1fr auto;
        margin-bottom: 20px;
      }

      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 15px;
        border-radius: 10px;
        cursor: pointer;
      }

      .chat-input {
        font-size: 15px;
        padding: 12px 15px;
        border-width: 1px;
        border-radius: 10px;
        margin-right: 10px;
      }

      .send-button {
        overflow: scroll;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .chatbot-container {
        font-family: Arial;
      }

      .chat-message-container-user {
        justify-content: right;
      }

      .chat-message-container-user, .chat-message-container-robot {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .chat-message-contents {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        max-width: 300px;
        margin-top: 0;
        margin-bottom: 0;
        overflow-wrap: break-word;
      }

      .chat-message-profile {
        width: 45px;
        height: 45px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({chatMessages, setChatMessages, isLoading, setIsLoading}) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(e){
          //console.log(event.target.value)
          setInputText(event.target.value)
        }

        async function sendMessage() {

          if (inputText === '') return
          
          const newChatMessages = [
            //spread operator
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ]

          setInputText('')
          setIsLoading(true)

          const response =  await Chatbot.getResponseAsync(inputText);
          setChatMessages([
            //spread operator
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ])
          setIsLoading(false)
        }

        return (
          <div className="chat-input-container">
            <input 
              placeholder="Send a message to Chatbot" 
              size="30"
              onChange={saveInputText} //onChange hook
              value={inputText} //controlled input
              onKeyDown={(e)=> e.key === "Enter" &&  sendMessage()}
              disabled={isLoading}
              className="chat-input"
            />

            <button 
              onClick={sendMessage} 
              disabled={isLoading || inputText === ''}
              className="send-button"
            >Send</button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        
        // if (sender === 'robot') {
        //   return (
        //     <div>
        //       <img src="robot.png" height="40"/>
        //       {message}
        //     </div>
        //   );
        // }

        // && gaurd operator - Short-Circuit Evaluation
        // && (Parentheses: Grouping)
        return (
          <div className={`chat-message-container-${sender}`}>
            {sender ===  'robot' && (
              <img src="robot.png" height="40"/>
            )}
            <p className="chat-message-contents">{message}</p>
            {sender ===  'user' && (
              <img src="user.png" height="40"/>
            )}
          </div>
        );
      }

      function ChatMessages({chatMessages}) {

        return (
          <div class="chat-messages-container js-chat-message-container">
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id}/>
              )
            })}
          </div>
        )
      }

      function App() {
        // const chatMessageComponents = chatMessages.map((chatMessage) => {
        //   return (
        //     <ChatMessage message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id}/>
        //   )
        // })

        const[isLoading, setIsLoading] = React.useState(false)

        const [chatMessages, setChatMessages] = React.useState([{
          message: 'hello chatbot',
          sender: 'user',
          id: 'id1'
        }, {
          message: 'Hello! How can I help you?',
          sender: 'robot',
          id: 'id2'
        }, {
          message: 'can you get me todays date?',
          sender: 'user',
          id: 'id3'
        }, {
          message: 'Today is October 30',
          sender: 'robot',
          id: 'id4'
        }]);

        // const chatMessages = array[0];
        // const setChaMessages = array[1];

        return(
          <div className="chatbot-container chatbot-container-top">
            <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} isLoading={isLoading} setIsLoading={setIsLoading} />
            <ChatMessages chatMessages={chatMessages} />
          </div>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
