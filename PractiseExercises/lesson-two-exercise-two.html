<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      //Lesson 2 Exercises - components and props
      //2e. Let's say we're creating aan e-commerce app, and one of the products is socks. Create and <App> component and display the details on onto the website:
      //    - Cotton socks, price $10.90, Add to card Button
      //2f. Display 2 more procust on the website: Tennis Balls and a t-shirt. Instead of duplicated code, create a ProductDetails component, and use probs to make it reusable.
      //    Then, display the three prodicys on thr website.

      function ProductDetails({item, price}) {
        return(
          <>
            <p>{item}</p>
            <p>{price}</p>
            <button>Add to cart</button>
          </>
        )
      }

      function App(){
        return(
          <>
            <ProductDetails item="Cotton Socks" price="10.90"/>
            <ProductDetails item="Tennis Ball" price="6.00"/>
            <ProductDetails item="Plain T-Shirt" price="7.99"/>
          </>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
