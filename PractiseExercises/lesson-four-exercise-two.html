<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>

    <style>
      .form-field{
        margin: 5px;
        width: 260px;
        padding: 8px;
      }
      .btn{
        margin: 8px;
        height: 32px;
        padding: 5px;
        border: none;
        border-radius: 5px;
        font-weight: bold;
      }
      .btn-form-action{
        background-color:rgb(66, 145, 236);
        color: white;
        width: 100px;
        font-size: medium;
      }
    </style>

  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
      function LoginForm() {
        const [showPass, setShowPass] = React.useState(false)
        return (
          <>
            <div>
              <input className="form-field" type="text" />
            </div>
            <div>
              <input className="form-field" type={showPass ? "text" : "password"} />
              <button className="btn" onClick={()=>setShowPass(showPass ? false : true)} >Show</button>
            </div>
            <button className="btn btn-form-action">Login</button>
            <button className="btn btn-form-action">Sign up</button>
          </>
        )
      }

      function App() {
        return(
          <>
            <LoginForm />
          </>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
