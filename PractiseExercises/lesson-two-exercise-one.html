<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      //Lesson 2 Exercises - components and props
      //2a. Create an <App> component that reutns a pragraph with the text "Hello, welcoem to my website" inside. Then, render this <App>
      //2b. Continue fomr 2a, in the <App> component, add 2 buttons after the paragraph: "Login" and "Sign up". Use a fragment to group them. use JSX on multple lines.
      //2c. Continuing from 2b, in the <App> component add 2 text boxes above thge buttons with the palceholders "email" and "password".
      //    - Layout the textboxes on seperate lines
      //    - try adding the attribute type="password" to password the textbox.
      //2d. Continuing from 2c, create a new component called LoginForm, and move the textboxes and buttons (all the login-related code) into this component. Then inside <App>,
      //    use the new component to create the new textboxes and buttons.

      function LoginForm() {
        return(
          <>
            <div>
              <input type="text" placeholder="email"/>
            </div>
            <div>
              <input type="password" placeholder="password"/>
            </div>
            <Button text="Login" />
            <Button text="Sign up" />
          </>
        )
      }

      function Button({text}){
        return(
          <>
            <button>{text}</button>
          </>
        )
      }

      function App(){
        return(
          <>
            <p>Hello, welcome to my website.</p>
            <LoginForm />
          </>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
